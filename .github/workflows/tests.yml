name: tests

on:
  push:
    branches:
      - master
      - 'OND211-**'
      - 'release/**'
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  auth-unit-tests:
    name: Keycloak auth surface unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Check out the ondewo-vtsi-api submodule
        # Deliberately not `submodules: recursive` on the checkout above: ondewo-proto-compiler is
        # an SSH remote no runner can clone. This one is public HTTPS, and it is the reference the
        # build-config specs compare the generated api/ stubs against — without it they can only
        # report SKIPPED.
        run: git submodule update --init src/ondewo-vtsi-api

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run auth unit tests with coverage (100% gate on auth surface)
        run: npx jest --config jest.config.js --coverage --ci
